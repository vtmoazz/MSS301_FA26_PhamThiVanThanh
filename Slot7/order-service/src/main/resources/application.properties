spring.application.name=order-service

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/order_service
spring.datasource.username=root
spring.datasource.password=mysql

# Tat auto-create schema vi dung Flyway
spring.jpa.hibernate.ddl-auto=none

# Port rieng vi 8080 da dung cho product-service
server.port=8081

# URL cua Inventory Service (externalize de doi theo moi truong, test tro sang WireMock)
inventory.url=http://localhost:8082

# (Tuy chon) Xem log request/response cua Feign khi debug
# logging.level.com.fudn.orderservice.client=DEBUG
