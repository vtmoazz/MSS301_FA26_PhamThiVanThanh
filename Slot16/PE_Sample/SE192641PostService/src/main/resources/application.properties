spring.application.name=SE192641PostService
server.port=8082

# Database (cùng database với User Service theo đề)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=MSS301_2026_PE_MEDIA;encrypt=false;
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Địa chỉ User Service cho OpenFeign
user.service.url=http://localhost:8081
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Giữ thứ tự field JSON theo thứ tự khai báo trong DTO (Jackson 3 mặc định sắp theo alphabet)
spring.jackson.mapper.sort-properties-alphabetically=false
